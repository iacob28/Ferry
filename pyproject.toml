[project]
name = "gopro-sync"
version = "0.1.0"
description = "Automatically offload a GoPro (BLE + Wi-Fi or USB) to a Synology share"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psutil>=5.9",
    "pydantic>=2.7",
    "smbprotocol>=1.13",
    "uvicorn>=0.30",
    "zeroconf>=0.132",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
gopro-sync = "gopro_sync.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gopro_sync"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
