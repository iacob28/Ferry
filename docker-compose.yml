services:
  ferry:
    image: ${FERRY_IMAGE:-harbor.dockerbit.com/ferry/ferry}:${FERRY_TAG:-latest}
    container_name: ferry
    restart: unless-stopped
    # Host networking: the service must see USB network devices (GoPro), drive the
    # Wi-Fi radios that join camera access points, and discover NAS devices over mDNS.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Docker's default AppArmor profile blocks D-Bus calls to bluetoothd.
    security_opt:
      - apparmor:unconfined
    environment:
      - TZ=${TZ:-UTC}
      - FERRY_PORT=${FERRY_PORT:-8780}
      # Optional: preset the admin password instead of creating it in the browser.
      - FERRY_PASSWORD=${FERRY_PASSWORD:-}
    volumes:
      - ${FERRY_DATA:-./data}:/data
      # Bluetooth through the host's bluetoothd.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
