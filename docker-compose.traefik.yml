# Optional: publish the UI through a Traefik instance on the same host.
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
# The app uses host networking, so Traefik reaches it through the gateway of its own
# Docker network (TRAEFIK_UPSTREAM, e.g. http://172.19.0.1:8780).
services:
  ferry:
    labels:
      - traefik.enable=true
      - traefik.http.routers.ferry.rule=Host(`${FERRY_DOMAIN:?set FERRY_DOMAIN}`)
      - traefik.http.routers.ferry.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.ferry.tls=true
      - traefik.http.routers.ferry.tls.certresolver=${TRAEFIK_CERTRESOLVER:-}
      - traefik.http.routers.ferry.service=ferry
      - traefik.http.services.ferry.loadbalancer.server.url=${TRAEFIK_UPSTREAM:?set TRAEFIK_UPSTREAM}
