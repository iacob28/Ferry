services:
  ferry:
    image: ${FERRY_IMAGE:-harbor.dockerbit.com/ferry/ferry}:${FERRY_TAG:-latest}
    container_name: ferry
    restart: unless-stopped
    # Host networking: the service must see USB network devices (GoPro), drive the
    # Wi-Fi radios that join camera access points, and discover NAS devices over mDNS.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      # Mount drones and cameras that connect as USB storage (read-only unless deleting).
      - SYS_ADMIN
    # USB disks only (sd*, block major 8); the Pi's own SD card (mmcblk) stays out of reach.
    device_cgroup_rules:
      - "b 8:* rmw"
      # Built-in SD slot (mmcblk): add only if the host does not boot from it, and switch on
      # "Built-in SD slot" in the USB provider settings.
      # - "b 179:* rmw"
    # Docker's default AppArmor profile blocks D-Bus calls to bluetoothd.
    security_opt:
      - apparmor:unconfined
    environment:
      - TZ=${TZ:-UTC}
      - FERRY_PORT=${FERRY_PORT:-8780}
      # Optional: preset the admin password instead of creating it in the browser.
      - FERRY_PASSWORD=${FERRY_PASSWORD:-}
    volumes:
      - ${FERRY_DATA:-./data}:/data
      # Bluetooth through the host's bluetoothd.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      # Device nodes for USB drives plugged in after start.
      - /dev:/dev
      # A host folder for "Local folder" destinations; it then shows up in the folder picker.
      # - /srv/media:/media
