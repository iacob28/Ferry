[project]
name = "ferry"
version = "0.2.0"
description = "Automatically offload cameras, drones and 3D printers to network storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=0.22",
    "fastapi>=0.115",
    "httpx>=0.27",
    "paho-mqtt>=2.0",
    "psutil>=5.9",
    "pydantic>=2.7",
    "smbprotocol>=1.13",
    "uvicorn>=0.30",
    "zeroconf>=0.132",
]

[project.optional-dependencies]
# Library thumbnails for USB drives and printers (decodes video frames).
media = ["av>=12"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyftpdlib>=2", "pyopenssl"]

[project.scripts]
ferry = "ferry.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ferry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
